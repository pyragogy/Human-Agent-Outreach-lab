<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">Human × Agent Outreach Lab</title>
  <desc id="desc">Two human and two agent nodes converging on a shared experimental space.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#334155" stroke-width="1" opacity=".18"/>
    </pattern>
  </defs>

  <rect width="1600" height="560" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="560" rx="28" fill="url(#grid)"/>
  <ellipse cx="800" cy="280" rx="520" ry="235" fill="url(#glow)" filter="url(#soft)"/>

  <g stroke="#64748b" stroke-width="2" opacity=".55">
    <path d="M300 170 C520 170 560 280 735 280"/>
    <path d="M300 390 C520 390 560 280 735 280"/>
    <path d="M1300 170 C1080 170 1040 280 865 280"/>
    <path d="M1300 390 C1080 390 1040 280 865 280"/>
  </g>

  <g fill="#e2e8f0">
    <circle cx="300" cy="170" r="15"/>
    <circle cx="300" cy="390" r="15"/>
  </g>
  <g fill="#93c5fd">
    <rect x="1285" y="155" width="30" height="30" rx="6"/>
    <rect x="1285" y="375" width="30" height="30" rx="6"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="300" y="125" text-anchor="middle" fill="#94a3b8" font-size="20" letter-spacing="2">HUMAN</text>
    <text x="300" y="445" text-anchor="middle" fill="#94a3b8" font-size="20" letter-spacing="2">HUMAN</text>
    <text x="1300" y="125" text-anchor="middle" fill="#93c5fd" font-size="20" letter-spacing="2">AGENT</text>
    <text x="1300" y="445" text-anchor="middle" fill="#93c5fd" font-size="20" letter-spacing="2">AGENT</text>

    <rect x="680" y="238" width="240" height="84" rx="42" fill="#0f172a" stroke="#93c5fd" stroke-width="2"/>
    <text x="800" y="289" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="700" letter-spacing="3">CO-DESIGN</text>

    <text x="800" y="82" text-anchor="middle" fill="#f8fafc" font-size="56" font-weight="800" letter-spacing="-1">
      HUMAN × AGENT OUTREACH LAB
    </text>
    <text x="800" y="510" text-anchor="middle" fill="#cbd5e1" font-size="23" letter-spacing=".5">
      One real project · Two humans · Two agents · An experiment not yet designed
    </text>
  </g>
</svg>